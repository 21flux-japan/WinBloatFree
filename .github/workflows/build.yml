name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the exe to a release

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test the engine
        run: dotnet run --project tests/WinBloatFree.Core.Tests -c Release

      - name: Publish portable exe
        run: dotnet publish src/WinBloatFree -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true -o artifacts/publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/publish/WinBloatFree.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinBloatFree.exe" | Out-File -Encoding ascii artifacts/publish/WinBloatFree.exe.sha256
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: WinBloatFree
          path: |
            artifacts/publish/WinBloatFree.exe
            artifacts/publish/WinBloatFree.exe.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/WinBloatFree.exe
            artifacts/publish/WinBloatFree.exe.sha256
          generate_release_notes: true
